; SWEA EmotiBit BLE firmware (ESP32 Feather only).
; Libraries are fetched by PlatformIO (pinned), the FeatherWing library is this repo (symlink://../).
[platformio]
extra_configs =
    ../board_feather_esp32.ini
src_dir = ./

[custom]
; -I: the symlinked FeatherWing library does not get SimpleFTPServer on its include path automatically
variant_flags = -DSTOCK_FIRMWARE -I$PROJECT_LIBDEPS_DIR/$PIOENV/SimpleFTPServer

[env]
lib_ldf_mode = deep+
lib_deps =
    symlink://../
    https://github.com/EmotiBit/EmotiBit_BMI160.git
    https://github.com/EmotiBit/EmotiBit_MAX30101.git
    https://github.com/EmotiBit/EmotiBit_MLX90632.git
    https://github.com/EmotiBit/EmotiBit_NCP5623.git
    https://github.com/EmotiBit/EmotiBit_SI7013.git
    https://github.com/EmotiBit/EmotiBit_XPlat_Utils.git
    https://github.com/EmotiBit/EmotiBit_ADS1X15.git
    https://github.com/EmotiBit/EmotiBit_External_EEPROM.git
    https://github.com/EmotiBit/EmotiBit_EmojiLib.git
    https://github.com/EmotiBit/EmotiBit_ArduinoFilters.git
    https://github.com/EmotiBit/EmotiBit_SimpleFTPServer.git
    https://github.com/EmotiBit/EmotiBit_KTD2026.git
    https://github.com/greiman/SdFat.git#2.2.0
    ; ArduinoLowPower, RTCZero and WiFi101 are Feather M0 only and are not used on ESP32
    https://github.com/bblanchon/ArduinoJson.git#v6.21.2
    https://github.com/adafruit/Adafruit_IS31FL3731.git#2.0.2
    https://github.com/adafruit/Adafruit-GFX-Library.git#1.11.9
    https://github.com/adafruit/Adafruit_BusIO.git#1.15.0

; BLE build: Wi-Fi is not compiled in (see ../SweaBleTransport.h). NimBLE-Arduino 1.4.x matches Arduino-ESP32 2.0.7.
[env:swea_ble_esp32]
extends = env:adafruit_feather_esp32
build_flags =
    ${env:adafruit_feather_esp32.build_flags}
    -DSWEA_BLE
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=16
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=40

    -I$PROJECT_LIBDEPS_DIR/$PIOENV/NimBLE-Arduino/src
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3
